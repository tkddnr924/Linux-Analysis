name: Build (Windows)

on:
  push:
    tags:
      - 'v*'          # v1.0.0 태그 push 시 자동 빌드
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

# Node 20 deprecation 대응 — JS 액션을 Node 24 런타임에서 실행 (2026-06-16 강제 전환의 조기 opt-in).
# 이걸 켜두면 action.yml 이 node20 으로 선언된 액션(upload/download-artifact 등)도 Node 24 에서 돌아
# deprecation 경고가 사라지고, 강제 전환일에 대비한 호환성 검증도 함께 됨.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 파서(Python) 를 먼저 빌드 → 뷰어(Electron) 안에 extraResources 로 번들 ──
  build-viewer:
    name: Viewer (파서 exe 내장)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      # 1) Python 파서 exe 빌드
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
      - name: Build parser (PyInstaller)
        run: pyinstaller linux-analyzer.spec
        # 결과: dist/linux-analyzer.exe  →  뷰어의 electron-builder.json 의
        # extraResources 가 pickup 해서 resources/pipeline/ 로 복사함.

      # 2) Electron 뷰어 빌드
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install & rebuild native modules
        working-directory: gui
        run: npm install
      - name: Build Electron app (Windows portable)
        working-directory: gui
        run: npm run build:win

      # 3) 릴리스 자산 스테이징 — 뷰어 exe + config.ini(사용자 편집용, exe 옆에 두게)
      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          cp gui/dist/*.exe release/
          cp config.ini     release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-analysis-viewer
          path: release/*

  # ── GitHub Release 자동 생성 ─────────────────────────
  release:
    name: Create Release
    needs: [build-viewer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
